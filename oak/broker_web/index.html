<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="oak-parent-origin" content="PARENT_ORIGIN"><title>Oak — тестовий вхід</title>
<link rel="stylesheet" href="/human.css"><script type="module" src="/human.js"></script></head>
<body><p class="test">Синтетичний тест. Не вводь дані справжнього акаунта.</p>
<p id="destination">Очікуємо перевірки призначення…</p>
<p id="status" role="status">Підключаємо окремий канал Oak…</p>
<img id="screen" alt="Сторінка тестового провайдера" tabindex="0" hidden>
<div id="typing" class="human-inputs" hidden><label for="text">Тестовий текст у вибране поле</label>
<input id="text" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="256">
<button type="button" id="send">Ввести</button><button type="button" id="tab">Tab</button><button type="button" id="enter">Enter</button></div>
<button id="cancel" hidden>Скасувати тестовий вхід</button></body></html>
